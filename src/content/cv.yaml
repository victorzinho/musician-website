headline:
  engineer: { en: Senior backend engineer and composer, es: Ingeniero backend sénior y compositor }
  musician: { en: "Composer, producer and guitarist", es: "Compositor, productor y guitarrista" }

summary:
  engineer:
    en: >-
      Backend engineer with more than fifteen years building data-heavy services: ingestion pipelines, message-driven
      microservices, PostgreSQL at tens of millions of rows. At xarvio (BASF) I led the services that turned satellite
      and machinery data into the maps that drive farm machinery. A composer with a conservatory degree, I want to
      build the tools musicians work with. I take vague requests to production on schedule, with little supervision.
    es: >-
      Ingeniero backend con más de quince años construyendo servicios con mucho volumen de datos: ingesta,
      microservicios con mensajería, PostgreSQL con decenas de millones de filas. En xarvio (BASF) lideré los servicios
      que convertían datos de satélite y de maquinaria en los mapas que guían a la maquinaria agrícola. Compositor
      titulado, quiero construir las herramientas con las que trabajan los músicos. Llevo peticiones difusas a
      producción en plazo, con poca supervisión.
  musician:
    en: >-
      Composer with a degree from the Conservatorio Superior Joaquín Rodrigo, premiered by the Cor de la Generalitat
      Valenciana and Antara Ensemble. I produce orchestral mockups and recordings, and for more than a decade I played
      guitar and keys in choir concerts, writing the band parts and handling the logistics. More than fifteen years of
      software engineering under real deadlines taught me to deliver on the date.
    es: >-
      Compositor titulado por el Conservatorio Superior Joaquín Rodrigo, estrenado por el Cor de la Generalitat
      Valenciana y Antara Ensemble. Produzco maquetas orquestales y grabaciones, y durante más de una década toqué
      guitarra y teclados en conciertos de coros, escribiendo las partes de la banda y ocupándome de la logística. Más
      de quince años de ingeniería de software con plazos reales me enseñaron a entregar en fecha.

