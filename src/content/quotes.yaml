# Placeholders until real quotes arrive, with permission (WEB-6, WEB-7); live on purpose, as an invitation.
- id: composer
  lang: es
  text: "Un encargo para un coro profesional no siempre es sinónimo de libertad compositiva. Limitaciones de plantilla, la filosofía y temática del programa, instrumentación, son condicionantes directos para la creatividad. **Ancho es el mar** resultó ser aire fresco, una idea que tejió a la perfección todos y cada uno de los flecos que la concibieron."
  translations:
    en: "A commission for a professional choir doesn't always come with compositional freedom. The limits of the forces, the program's philosophy and theme, the instrumentation: all of them directly shape creativity. **Ancho es el mar** turned out to be a breath of fresh air, an idea that perfectly wove together every last thread it was conceived from."
  name: "Jordi Blanch"
  role:
    en: Conductor of the Cor de la Generalitat Valenciana
    es: Director del Cor de la Generalitat Valenciana
- id: performer
  lang: es
  text: "He tenido la suerte de conocer a Víctor en muchas facetas: como alumno, técnico de sonido, compositor, arreglista, guitarrista, amigo... En absolutamente todas, destaca. Es de esas personas polifacéticas que hacen que uno se relaje trabajando con él, porque sabes que todo estará bien hecho, y además con un sello propio y de gran calidad."
  translations:
    en: "I've been lucky enough to know Víctor in many roles: as a student, sound engineer, composer, arranger, guitarist, friend... He stands out in absolutely every one of them. He's one of those multifaceted people who put you at ease when you work with them, because you know everything will be done well, and with a high-quality stamp all his own."
  name: "César Cabedo"
  role:
    en: Deputy Director of the Conservatorio Profesional de Música de Torrent
    es: Vicedirector del Conservatorio Profesional de Música de Torrent
- id: playing/desluthiers
  lang: es
  text: "Con Víctor en Desluthiers nunca sabías si estabas en un concierto o en un número de magia: a mitad del bolo te ajustaba la mezcla desde la mesa de sonido, bajaba corriendo a marcarse un solazo con la guitarra con un arreglo propio y volvía a la mesa sin despeinarse."
  translations:
    en: "With Víctor in Desluthiers you never knew whether you were at a concert or watching a magic act: halfway through the gig he'd be adjusting the mix from the sound desk, then run down to nail a killer guitar solo on an arrangement of his own, and be back at the desk without breaking a sweat."
  name: "César Cabedo"
  role:
    en: Member of Desluthiers
    es: Miembro de Desluthiers
