name: Verify and deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploying to GitHub Pages needs these on the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a running one finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Checks, builds dist/ and checks it; any failure stops the deploy.
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
